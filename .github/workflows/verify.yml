name: Verify FYNX Wallet
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix firebase-wallet/functions
      - run: npm ci --ignore-scripts --prefix firebase-waitlist/functions
      - run: npm run check
      - run: git diff --exit-code -- wallet-assets/app.js wallet-assets/app.js.LEGAL.txt owner.html firebase-wallet/functions/dashboard.html
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix firebase-wallet/functions
      - run: npm audit --omit=dev --audit-level=high --prefix firebase-waitlist/functions
